name: Build Windows executable

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller PyQt6

      - name: Run sanity tests
        shell: bash
        run: |
          export QT_QPA_PLATFORM=offscreen
          python test_core_sanity.py

      - name: Build FretboardTrainer.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name FretboardTrainer --add-data "fonts;fonts"
          --collect-submodules ui --collect-submodules core --collect-submodules data
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: FretboardTrainer-windows
          path: dist/FretboardTrainer.exe

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FretboardTrainer.exe
